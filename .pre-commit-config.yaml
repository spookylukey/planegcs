repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]


  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck (wrapper code)
        entry: cppcheck --enable=warning,style,performance,portability --std=c++20 --suppress=missingIncludeSystem --suppress=*:*/planegcs/* -I src -I src/planegcs -I src/planegcs/shims --error-exitcode=1
        language: system
        files: ^src/(wrapper\.h|bindings\.cpp)$
        types_or: [c, c++]
        # Also match .h files (identified as type 'c' by pre-commit)
